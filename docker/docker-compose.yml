version: "2.2"
services:
  slicerros_csc379_franka:
    build:
      context: .
      dockerfile: Dockerfile_csc379_franka
    container_name: slicerros_csc379_franka
    tty: true
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    privileged: true      
    network_mode: host
    devices:
    - /dev:/dev
    user: root
    volumes:  
      - ../scratchpad:/home/csc379/scratchpad:rw
